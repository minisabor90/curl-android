name: Build and Publish

on:
  pull_request:
  push:
    branches:
      - '**'
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Copy version files
        shell: bash
        run: |
          cp curl/src/main/native/config/versions/nghttp2ver.h curl/src/main/native/nghttp2/lib/includes/nghttp2/nghttp2ver.h
          cp curl/src/main/native/config/versions/nghttp3ver.h curl/src/main/native/nghttp3/lib/includes/nghttp3/version.h
          cp curl/src/main/native/config/versions/ngtcp2ver.h curl/src/main/native/ngtcp2/lib/includes/ngtcp2/version.h
          echo "#include \"tool_hugehelp.h\"" > curl/src/main/native/curl/src/tool_hugehelp.c

      - name: Configure Environment
        shell: bash
        run: |
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Brotli
        shell: bash
        run: |
          if [ -d "curl/src/main/native/brotli" ]; then
            echo "Brotli submodule found"
          else
            echo "Brotli submodule not found, cloning it"
            git clone https://github.com/google/brotli.git curl/src/main/native/brotli
          fi
          if ! grep -q "brotli/c/include" curl/src/main/native/Android.mk; then
            echo "Warning: Android.mk might not include Brotli paths correctly"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          ./gradlew :t:assemble
          ./gradlew :c:publishToMavenLocal
          ./gradlew :c:publishToMavenLocal -PenableLTO=1

      - name: Import GPG Key (for Publishing)
        if: github.event_name == 'release'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > decoded.key
          gpg --batch --import decoded.key
          gpg --list-secret-keys  # Debug: Verify the key is imported
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central
        if: github.event_name == 'release'
        run: |
          ./gradlew :c:publishReleasePublicationToSonatypeRepository \
            -PenableLTO=${{ github.event.release.prerelease }} \
            -Psigning.gnupg.keyName=${{ secrets.GPG_KEY_ID }} \
            -Psigning.gnupg.passphrase=${{ secrets.GPG_PASSPHRASE }} \
            --stacktrace --info
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Close and Release Repository
        if: github.event_name == 'release'
        run: |
          ./gradlew :c:closeAndReleaseSonatypeStagingRepository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Upload App Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: tool/build/outputs
          compression-level: 9

      - name: Upload Library Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library
          path: ~/.m2
          compression-level: 9
          include-hidden-files: true
